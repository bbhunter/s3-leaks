name: Readme Generation Check

# Enforces that README.md is always the generated output of incidents.yaml.
# If someone edits incidents.yaml without regenerating (or hand-edits
# README.md), this check fails and tells them to run the generator.

on:
  pull_request:
    paths:
      - 'incidents.yaml'
      - 'README.md'
      - 'scripts/generate_readme.py'
      - '.github/workflows/generate-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Verify README.md is in sync with incidents.yaml
        run: python scripts/generate_readme.py --check
