name: Link Check

# Verifies that the source URLs cited in README.md still resolve.
#
# - On pull requests that touch README.md: fails the check if any link is
#   broken, so rotted links are caught before they merge.
# - Weekly (and on manual dispatch): runs without failing the workflow and,
#   if anything is broken, opens a GitHub issue with the report so link rot
#   that happens *after* merge still gets surfaced.
#
# Scoped to README.md on purpose. When README.md eventually graduates to
# replace README.md, add 'README.md' to the `args` and `paths` lists below.

on:
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/link-check.yml'
      - '.github/lychee.toml'
  schedule:
    # Mondays at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links in README.md
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config ./.github/lychee.toml
            --cache
            --no-progress
            README.md
          # Block the merge on PRs; on scheduled/manual runs don't fail the
          # workflow — the next step opens an issue instead.
          fail: ${{ github.event_name == 'pull_request' }}

      - name: Open an issue when scheduled run finds broken links
        if: ${{ github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0 }}
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Broken links found in README.md"
          content-filepath: ./lychee/out.md
