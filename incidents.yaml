iam_credentials:
- date: 2026-02
  org_date: <a href="https://www.theregister.com/2026/02/04/aws_cloud_breakin_ai_assist">AI-Assisted AWS Break-In in 8 Minutes (Feb 2026)</a>
  root_cause: Valid test credentials harvested from a **public S3 bucket** belonged to an IAM user holding read/write on AWS Lambda; attacker escalated by replacing the code of an existing `EC2-init` function via `UpdateFunctionCode`/`UpdateFunctionConfiguration`.
  impact: Administrative privileges in under 10 minutes, 19 AWS principals compromised, Bedrock models and GPU compute abused. Payload carried LLM tells (hallucinated AWS account IDs, non-existent GitHub repos) indicating AI-assisted offensive tooling.
  relevance: Keys left in an open bucket became full account takeover in minutes → the bucket exposure and the IAM blast radius are one incident, not two.
- date: 2026-01
  org_date: <a href="https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/">Amazon SES Phishing & BEC Campaign (Jan 2026)</a>
  root_cause: Attackers scan public repositories, configuration backups and Docker images for AWS IAM access keys, then use the hijacked account's Amazon SES permissions to send mail.
  impact: Phishing and BEC delivered from legitimate SES infrastructure passes SPF, DKIM and DMARC checks; Kaspersky reported a sharp rise in SES-delivered phishing in early 2026, commonly spoofing e-signature notifications.
  relevance: Leaked static keys get monetised without ever touching S3 data — the account's sending reputation is itself the asset.
- date: '2026'
  org_date: <a href="https://www.wiz.io/blog/cloud-threat-highlights-h1-2026">JINX-0163 / "FulcrumSec" Cloud Extortion (H1 2026)</a>
  root_cause: Extortion crew that targets non-human identities — service accounts and IAM roles rather than end users — pivoting from a single over-privileged identity or an exposed state file to a full inventory of an organisation's secrets.
  impact: Operates across AWS, Azure, GCP, Okta and Snowflake; victims extorted by an actor calling itself "FulcrumSec" claiming terabytes of stolen data. Wiz recorded a 60% rise in significant cloud incidents versus H2 2025.
  relevance: Over-privileged roles and exposed Terraform state have overtaken user credentials as the route to an org's secrets.
- date: '2025'
  org_date: <a href="https://www.bleepingcomputer.com/news/security/ransomware-abuses-amazon-aws-feature-to-encrypt-s3-buckets/">Large-scale AWS Keys Database & Ransomware Campaign (2025)</a>
  root_cause: Public server exposed >158M AWS secret key records; 1,229 active keys used to encrypt S3 buckets and demand ransom.
  impact: Attackers encrypted S3 data using SSE-C without owner awareness.
  relevance: Demonstrates that static keys become commodities → direct ransomware targeting S3.
- date: '2024'
  org_date: <a href="https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/">Large Leak of Environment Variables (2024)</a>
  root_cause: 'Palo Alto Networks study: >90,000 leaked `.env` files; 1,185 contained AWS access keys.'
  impact: Keys leaked from repos, CI/CD logs, misconfigured files.
  relevance: Reinforces that static/long-lived keys end up everywhere → high-risk credentials.
- date: '2024'
  org_date: <a href="https://isc.sans.edu/diary/30730">Developer Canary Token Test (2024)</a>
  root_cause: Researcher placed a fake AWS key on GitHub; it was used within **minutes** (days when placed only on a website).
  impact: Demonstrated active scanning for AWS keys in public code.
  relevance: Proves exposure-to-compromise window is minutes → rapid detection & rotation required.
- date: '2023'
  org_date: <a href="https://www.techtarget.com/searchsecurity/news/366542352/Attackers-discovering-exposed-cloud-assets-within-minutes">Honey-Bucket S3 Recon Research (2023)</a>
  root_cause: Researchers deployed honey-buckets showing automated scans/downloads/deletes as soon as credentials or endpoints surfaced.
  impact: Showed constant automated reconnaissance in the wild.
  relevance: Demonstrates that once keys or endpoints leak, S3 becomes an immediate target.
- date: '2020'
  org_date: <a href="https://www.upguard.com/breaches/identity-and-access-misstep-how-an-amazon-engineer-exposed-credentials-and-more">AWS Engineer Leak (Jan 2020)</a>
  root_cause: Public GitHub repo by an AWS engineer contained system credentials including AWS key-pairs (one named `rootkey.csv`).
  impact: Repo discovered within ~30 minutes; AWS remediated same day.
  relevance: Even cloud vendors have human error → continuous scanning is essential.
- date: '2019'
  org_date: <a href="https://www.gitguardian.com/state-of-secrets-sprawl-on-github-2021">Generic Code-Repo Exposures (2019–2020)</a>
  root_cause: Multiple cases of AWS keys committed to GitHub/VCS; Medium posts highlight accidental leaks & attacker automation.
  impact: Often unnoticed but cumulatively large attack surface.
  relevance: Emphasizes importance of scanning for `AKIA...`, reviewing last-used dates, disabling stale keys.
- date: '2014'
  org_date: <a href="https://www.theregister.com/2014/06/18/code_spaces_destroyed/">www.codespaces.com (17th of June 2014)</a>
  root_cause: The attacker gained access to one of Code Spaces' AWS IAM access keys. The exact method has never been 100% confirmed publicly, but all evidence points to a compromised AWS access key, which allowed the attacker to log into the AWS console.
  impact: The company was shut down.
  relevance: Yes — one single AWS key can take a company down.
- date: 2024-01
  org_date: <a href="https://www.bleepingcomputer.com/news/security/a-mishandled-github-token-exposed-mercedes-benz-source-code/">Mercedes-Benz GitHub Token Leak (Jan 2024)</a>
  root_cause: An employee leaked a GitHub token (exposed Sept 2023, discovered Jan 2024) that opened the company's GitHub Enterprise server, exposing AWS and Azure keys, connection strings, SSO passwords and API keys.
  impact: Full source code plus embedded cloud credentials exposed; the token was revoked in January 2024.
  relevance: Shows how a single leaked token cascades directly into cloud (IAM) key exposure.
- date: '2023'
  org_date: <a href="https://unit42.paloaltonetworks.com/malicious-operations-of-exposed-iam-keys-cryptojacking/">EleKtra-Leak Campaign (2023)</a>
  root_cause: Unit 42 documented automated cloning of public GitHub repos to harvest exposed AWS IAM access keys within minutes, then launching EC2 instances for cryptojacking.
  impact: 474 actor-controlled EC2 miner instances observed over roughly five weeks (Aug–Oct 2023).
  relevance: Proves exposed IAM keys are found and weaponized automatically, at scale, almost immediately.
- date: 2022-10
  org_date: <a href="https://www.bleepingcomputer.com/news/security/toyota-discloses-data-leak-after-access-key-exposed-on-github/">Toyota GitHub Access Key Leak (Oct 2022)</a>
  root_cause: A credential granting access to a customer-data server was hardcoded in a public GitHub repo for nearly five years (Dec 2017–Sep 2022).
  impact: Data for roughly 296,000 customers was potentially accessible via the exposed key.
  relevance: A long-lived static credential in source control means years of silent, undetected exposure.
- date: 2019-08
  org_date: <a href="https://www.bankinfosecurity.com/impervas-post-mortem-api-key-left-exposed-a-13238">Imperva (Cloud WAF / Incapsula) API Key Exposure (2019)</a>
  root_cause: An internet-exposed internal compute instance held an administrative AWS API key that was stolen and used to reach a database snapshot of Incapsula customer data.
  impact: Customer emails, salted and hashed passwords, and some API and TLS keys exposed; 13,000+ passwords and 1,400 API keys rotated.
  relevance: A single exposed long-lived API key gave direct access to customer data in AWS.
- date: 2021-04
  org_date: <a href="https://www.rapid7.com/blog/post/2021/04/16/codecov-discloses-supply-chain-compromise/">Codecov Bash Uploader Supply-Chain Breach (2021)</a>
  root_cause: Attackers tampered with Codecov's CI Bash Uploader script to exfiltrate environment variables — including AWS IAM keys — from customer CI pipelines.
  impact: Up to 29,000 customers potentially affected (including Twitch, HashiCorp, Confluent); undetected for two months.
  relevance: CI/CD is a mass-harvesting vector for long-lived AWS keys stored as pipeline secrets.
- date: 2023-01
  org_date: <a href="https://techcrunch.com/2023/01/05/circleci-breach/">CircleCI Secrets Breach (Jan 2023)</a>
  root_cause: Malware on an employee device stole an SSO session token, giving an attacker access to customer secrets and encryption keys stored in CircleCI.
  impact: CircleCI forced all customers to rotate every secret, including AWS tokens, stored on the platform.
  relevance: A compromised CI platform exposes every AWS credential its customers stored there.
- date: 2018-02
  org_date: <a href="https://www.cnbc.com/2018/02/21/hackers-hijack-teslas-cloud-system-to-mine-cryptocurrency-redlock.html">Tesla Cloud Cryptojacking (Feb 2018)</a>
  root_cause: An unsecured (no-password) Kubernetes admin console exposed Tesla's AWS credentials, which also had access to S3 buckets.
  impact: Attackers used the credentials to run cryptomining; RedLock found non-public data was reachable in S3.
  relevance: Exposed orchestration consoles leak the AWS keys behind them.

# Industry-wide studies of bucket exposure, rather than single-organisation
# incidents. Scans cover multiple cloud providers; they are listed here because
# Amazon S3 is consistently a major share of what they find.
research:
- date: 2026-05
  org: Mysterium VPN
  category: Research
  description: Scan of public cloud storage found 535,480 openly accessible buckets across Amazon S3, Google Cloud, Azure, DigitalOcean and Alibaba holding close to 20 billion files
  url: https://www.scworld.com/brief/nearly-20-billion-files-exposed-in-misconfigured-cloud-buckets
  records: 535,480 buckets / ~20B files
  notes: Included 685,047 credential and key files (.env files, private keys) and close to 1 million database dumps (.sql, .bak), which give access to live systems rather than only to stored data
- date: 2025-05
  org: Cyble
  category: Research
  description: Vulnerability scanning across seven major cloud providers detected more than 660,000 misconfigured storage buckets leaking roughly 200 billion files
  url: https://cybernews.com/security/misconfigured-cloud-buckets-leaking-200-billion-fil/
  records: 660,000 buckets / 200B files
  notes: Filtering for sensitive file types returned 5.6M Go source files, 110,000 environment credential files and more than 1.6M confidential documents; the exposed bucket count was over 30% higher than the same scan a year earlier
